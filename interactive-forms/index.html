<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário Interativo</title>

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <section class="divPai">
      <div class="card loginActive">
        <div class="leftContainer">
          <div class="formLogin">
            <h2>Faça seu Login</h2>

            <form>
              <input type="text" placeholder="Digite e-mail" />
              <input type="password" placeholder="Digite senha" />
              <button type="submit" class="loginButton">Entrar</button>
            </form>
          </div>

          <div class="containerLogin">
            <h2>Não possui conta?</h2>
            <p>
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugit
              quasi consectetur laboriosam? Laboriosam, numquam magnam mollitia.
            </p>

            <button class="btnRegister">Cadastre-se</button>
          </div>
        </div>

        <div class="rightContainer">
          <div class="formCadastro">
            <h2>Cadastre-se</h2>

            <form>
              <input type="text" placeholder="Nome" />
              <input type="email" placeholder="E-mail" />
              <input type="password" placeholder="Senha" />
              <input type="password" placeholder="Confirmar Senha" />

              <button type="submit">Cadastrar</button>
            </form>
          </div>

          <div class="facaCadastro">
            <h2>Não possui uma conta?</h2>

            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.</p>
            <button>Cadastre-se</button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
